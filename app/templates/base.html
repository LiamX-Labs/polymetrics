<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Polymetrics - Polymarket Wallet Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/polymetrics.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navigation Header -->
    <nav class="main-nav" style="background: linear-gradient(135deg, var(--primary-purple) 0%, var(--primary-orange) 100%); padding: 15px 30px; margin-bottom: 20px; border-radius: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto;">
            <div style="display: flex; align-items: center; gap: 30px;">
                <a href="/" style="text-decoration: none; color: white; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 12px;">
                    <img src="{{ url_for('static', filename='images/logo2.jpg') }}"
                         style="width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.5);"
                         alt="Polymetrics Logo">
                    Polymetrics
                </a>
                <div style="display: flex; gap: 15px;">
                    <a href="/" class="nav-link" style="color: rgba(255, 255, 255, 0.9); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.3s;">
                        Home
                    </a>
                    <a href="/leaderboard" class="nav-link" style="color: rgba(255, 255, 255, 0.9); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.3s;">
                        Leaderboard
                    </a>
                    <a href="/compare" class="nav-link" style="color: rgba(255, 255, 255, 0.9); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.3s;">
                        Compare
                    </a>
                </div>
            </div>

            <!-- Search Box -->
            <div style="flex: 1; max-width: 500px; margin: 0 30px;">
                <form action="/wallet/analyze" method="get" style="display: flex;">
                    <input
                        type="text"
                        name="address"
                        placeholder="Enter wallet address to analyze..."
                        style="flex: 1; padding: 10px 15px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 8px 0 0 8px; color: white; font-size: 0.9rem;"
                        required
                    >
                    <button
                        type="submit"
                        style="padding: 10px 20px; background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255, 255, 255, 0.3); border-left: none; border-radius: 0 8px 8px 0; color: white; cursor: pointer; font-weight: 600; transition: all 0.3s;"
                    >
                        Analyze
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 0 20px;">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer style="margin-top: 60px; padding: 30px 0; text-align: center; color: var(--text-secondary); border-top: 1px solid var(--border-color);">
        <div class="container">
            <p>Polymetrics - Advanced Polymarket Wallet Analytics</p>
            <p style="font-size: 0.85rem; margin-top: 10px; opacity: 0.7;">
                Data sourced from <a href="https://polymarket.com" target="_blank" style="color: var(--primary-orange);">Polymarket</a>
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    {% block extra_scripts %}{% endblock %}

    <style>
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2) !important;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        button:hover {
            background: rgba(255, 255, 255, 0.4) !important;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            /* Navbar mobile adjustments */
            .main-nav {
                padding: 12px 15px !important;
                border-radius: 12px !important;
            }

            .main-nav > div {
                flex-direction: column !important;
                gap: 15px !important;
            }

            .main-nav > div > div:first-child {
                flex-direction: column !important;
                gap: 12px !important;
                width: 100%;
            }

            .main-nav > div > div:first-child > a {
                font-size: 1.2rem !important;
            }

            .main-nav > div > div:first-child > div {
                gap: 8px !important;
            }

            .main-nav > div > div:nth-child(2) {
                max-width: 100% !important;
                margin: 0 !important;
            }

            /* Container padding */
            .container {
                padding: 0 15px !important;
            }

            /* Hero section mobile */
            header {
                padding: 25px 20px !important;
                margin-bottom: 25px !important;
            }

            header > div:nth-child(2) {
                flex-direction: column !important;
                text-align: center !important;
                gap: 20px !important;
            }

            header img {
                width: 80px !important;
                height: 80px !important;
            }

            header h1 {
                font-size: 2rem !important;
            }

            header p {
                font-size: 1rem !important;
            }

            header p:last-child {
                font-size: 0.85rem !important;
            }

            /* Hide splash effect on mobile */
            header > div:first-child {
                display: none !important;
            }

            /* Metrics grid mobile */
            .metrics-grid {
                grid-template-columns: 1fr !important;
                gap: 15px !important;
            }

            /* Table containers */
            .table-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .table-container table {
                min-width: 600px;
            }

            /* Section headers */
            .section-header {
                font-size: 1.3rem !important;
            }

            /* Buttons */
            button, .analyze-btn {
                min-height: 44px !important;
                min-width: 44px !important;
            }
        }

        /* Tablet/iPad Responsive Styles */
        @media (min-width: 769px) and (max-width: 1024px) {
            .main-nav {
                padding: 12px 20px !important;
            }

            .container {
                padding: 0 20px !important;
            }

            header {
                padding: 35px 30px !important;
            }

            header img {
                width: 100px !important;
                height: 100px !important;
            }

            header h1 {
                font-size: 2.4rem !important;
            }

            .metrics-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) !important;
            }

            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</body>
</html>
